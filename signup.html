<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VanConnect | Registration</title>
<style>
  :root {
    --primary: #2a5298;
    --accent: #fbbf24;
    --bg: #f0f4ff;
    --card-radius: 16px;
    --transition: 0.3s ease;
    --shadow: 0 8px 24px rgba(0,0,0,0.1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"Segoe UI",Arial,sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#111;
  }
  .form-container {
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(12px);
    padding:2rem;
    border-radius: var(--card-radius);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 400px;
  }
  h2 { text-align:center; color: var(--primary); margin-bottom:1.5rem; }
  form { display:flex; flex-direction:column; gap:1rem; }
  input, select {
    padding:0.8rem 1rem;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:1rem;
    transition: border var(--transition);
  }
  input:focus, select:focus { outline:none; border-color: var(--primary); }
  .btn {
    padding:0.8rem 1rem;
    border:none;
    border-radius:10px;
    background: var(--primary);
    color:white;
    font-size:1rem;
    cursor:pointer;
    transition: background var(--transition), transform var(--transition);
  }
  .btn:hover { background: #1e3c72; transform: scale(1.05); }
  .link { text-align:center; font-size:0.9rem; }
  .link a { color: var(--accent); text-decoration:none; }
  .link a:hover { text-decoration:underline; }
</style>
</head>
<body>

<div class="form-container">
  <h2>VanConnect Sign Up</h2>
  <form id="signupForm">
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="text" id="usn" placeholder="USN / ID" required>
    <input type="password" id="password" placeholder="Password" required>
    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
    <select id="role" required>
      <option value="" disabled selected>Select Role</option>
      <option value="student">Student</option>
      <option value="driver">Driver</option>
      <option value="admin">Admin</option>
    </select>
    <button type="submit" class="btn">Sign Up</button>
  </form>
  <p class="link">Already have an account? <a href="#">Login here</a></p>
</div>

<script>
document.getElementById('signupForm').addEventListener('submit', function(e){
  e.preventDefault(); // prevent form submission

  // Get role value
  const role = document.getElementById('role').value;

  // Simple frontend redirect based on role
  if(role === 'student'){
    window.location.href = 'student-dashboard.html';
  } else if(role === 'driver'){
    window.location.href = 'driver.html';
  } else if(role === 'admin'){
    window.location.href = 'admin.html';
  } else {
    alert('Please select a role');
  }
});
</script>

</body>
</html>
